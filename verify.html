<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify a Certificate — Assay</title>
<meta name="description" content="Verify an Assay AI security verification certificate." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0b0d; color: #e8e8e8; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  p { color: #b8b8b8; margin-bottom: 24px; }
  input { width: 100%; padding: 14px 16px; font-size: 1rem; border: 1px solid #333; border-radius: 8px; background: #141619; color: #fff; margin-bottom: 12px; }
  button { background: #4a9eff; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:hover { background: #3a8eef; }
  #result { margin-top: 32px; }
  .cert { background: #141619; border-radius: 8px; padding: 24px; border-left: 3px solid #4a9eff; }
  .cert.verified { border-left-color: #3ddc84; }
  .cert.partial { border-left-color: #ffb020; }
  .cert h2 { margin-bottom: 12px; }
  .cert dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; }
  .cert dt { color: #888; }
  .cert dd { color: #fff; }
  .notfound { background: #141619; border-radius: 8px; padding: 24px; border-left: 3px solid #ff5252; }
  a { color: #4a9eff; }
  .back { margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Verify a Certificate</h1>
  <p>Enter an Assay Verification ID to confirm the certificate is genuine.</p>
  <input id="vid" type="text" placeholder="ASSAY-XXXXXXXXXXXX" autocomplete="off" />
  <button onclick="lookup()">Verify</button>
  <div id="result"></div>
  <p class="back"><a href="/">Back to Assay</a></p>
</div>
<script>
let registry = [];
fetch('verification-registry.json')
  .then(r => r.json())
  .then(d => { registry = d; })
  .catch(() => { document.getElementById('result').innerHTML = '<div class="notfound"><p>Registry unavailable. Try again later.</p></div>'; });

function lookup() {
  const vid = document.getElementById('vid').value.trim().toUpperCase();
  const el = document.getElementById('result');
  if (!vid) { el.innerHTML = ''; return; }
  const entry = registry.find(e => e.verification_id === vid);
  if (!entry) {
    el.innerHTML = '<div class="notfound"><h2>Not found</h2><p>No certificate with this ID. Check the ID and try again.</p></div>';
    return;
  }
  const cls = entry.result === 'VERIFIED' ? 'verified' : 'partial';
  el.innerHTML = '<div class="cert ' + cls + '">'
    + '<h2>' + entry.result + '</h2>'
    + '<dl>'
    + '<dt>Verification ID</dt><dd>' + entry.verification_id + '</dd>'
    + '<dt>Target</dt><dd>' + entry.target + '</dd>'
    + '<dt>Test date</dt><dd>' + entry.test_date + '</dd>'
    + '<dt>Issued</dt><dd>' + entry.issued_at + '</dd>'
    + '<dt>Risk score</dt><dd>' + entry.risk_score + '</dd>'
    + '</dl></div>';
}
document.getElementById('vid').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
</script>
</body>
</html>
